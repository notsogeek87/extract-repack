name: Build

on:
  # Toutes les branches, pas seulement staging/main : ça valide une branche de travail avant de la
  # fusionner (voir rangele/CLAUDE.md pour le raisonnement complet). Les APK et les releases, eux,
  # restent réservés à staging/main.
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

# Un nouveau push sur une branche de travail annule le run précédent ; sur staging/main les runs
# sont conservés, chacun publiant sa propre release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'staging' && github.ref_name != 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Publication (APK + releases) uniquement depuis les branches de livraison.
      PUBLISH: ${{ github.ref_name == 'staging' || github.ref_name == 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # innoextract/freearc sont vendorisés en sous-modules (native/third_party/) — voir README.
          submodules: recursive

      - name: Compute build identifiers
        id: ids
        run: |
          echo "sha=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          # Un nom d'artifact ne peut pas contenir "/" : `claude/ma-branche` deviendrait invalide.
          echo "ref_slug=$(echo "${{ github.ref_name }}" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests (:app + :core)
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Read app version name
        id: version
        run: |
          version="$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]*)".*/\1/')"
          if [ -z "$version" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Rename APK for this commit
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p artifact
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::Could not find built APK"
            exit 1
          fi
          # Copie horodatée par commit, gardée comme artifact de run.
          cp "$apk" "artifact/arcextract-${{ steps.ids.outputs.sha }}.apk"
          # Nom ArcExtract-<version>-<build>, attaché à une release dédiée à ce build : chaque push
          # obtient sa propre release, pas un asset partagé qu'on écrase.
          cp "$apk" "artifact/ArcExtract-${{ steps.version.outputs.value }}-${{ github.run_number }}.apk"

      - name: Upload APK artifact
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: arcextract-${{ steps.ids.outputs.sha }}
          path: artifact/arcextract-${{ steps.ids.outputs.sha }}.apk
          if-no-files-found: error

      - name: Publish release for this build
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}-${{ github.run_number }}
          name: "ArcExtract ${{ steps.version.outputs.value }} (build ${{ github.run_number }})"
          prerelease: ${{ github.ref_name == 'staging' }}
          files: artifact/ArcExtract-${{ steps.version.outputs.value }}-${{ github.run_number }}.apk
          body: |
            Build automatique depuis le commit `${{ steps.ids.outputs.sha }}` (branche `${{ github.ref_name }}`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ steps.ids.outputs.ref_slug }}-${{ github.run_number }}
          path: |
            app/build/reports/tests
            core/build/reports/tests
          if-no-files-found: ignore
